{# theme-toggle — Django Cotton. See registry/ui/theme-toggle.tsx for platform references. #}
<c-vars
  value="system"
  name="theme"
  id="theme-toggle"
  :disabled="False"
  aria-label="Colour theme"
  :aria-labelledby="None"
  :aria-describedby="None"
  class=""
/>
{% load l10n %}{% localize off %}
<div role="radiogroup"{% if aria_labelledby %} aria-labelledby="{{ aria_labelledby|default_if_none:"" }}"{% else %} aria-label="{{ aria_label }}"{% endif %}{% if aria_describedby %} aria-describedby="{{ aria_describedby|default_if_none:"" }}"{% endif %}{% if disabled %} aria-disabled="true"{% endif %}
     data-slot="theme-toggle"
     data-name="{{ name }}"
     data-value="{{ value }}"
     class="inline-flex items-center gap-0.5 rounded-md border bg-muted p-0.5 text-muted-foreground shadow-xs aria-disabled:pointer-events-none aria-disabled:opacity-50 {{ class }}" {{ attrs }}>
  <span class="relative inline-flex">
    <input type="radio"
           id="{{ id }}-system"
           name="{{ name }}"
           value="system"{% if "system" == value %} checked{% endif %}{% if disabled %} disabled{% endif %}
           class="peer sr-only"
           data-slot="theme-toggle-item">
    <label for="{{ id }}-system" class="relative inline-flex size-7 cursor-pointer items-center justify-center rounded-[5px] outline-none transition-colors peer-hover:bg-background/60 peer-hover:text-foreground peer-checked:bg-background peer-checked:text-foreground peer-checked:shadow-xs peer-focus-visible:ring-[3px] peer-focus-visible:ring-ring/50 peer-disabled:cursor-not-allowed peer-disabled:opacity-50 [&_svg]:pointer-events-none [&_svg]:size-4 [&_svg]:shrink-0" data-slot="theme-toggle-label" title="{% if "system" == "system" %}System{% elif "system" == "light" %}Light{% elif "system" == "dark" %}Dark{% endif %}">
      {% if "system" == "system" %}<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>{% elif "system" == "light" %}<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>{% elif "system" == "dark" %}<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>{% endif %}
      <span class="sr-only">{% if "system" == "system" %}System{% elif "system" == "light" %}Light{% elif "system" == "dark" %}Dark{% endif %}</span>
    </label>
  </span>
  <span class="relative inline-flex">
    <input type="radio"
           id="{{ id }}-light"
           name="{{ name }}"
           value="light"{% if "light" == value %} checked{% endif %}{% if disabled %} disabled{% endif %}
           class="peer sr-only"
           data-slot="theme-toggle-item">
    <label for="{{ id }}-light" class="relative inline-flex size-7 cursor-pointer items-center justify-center rounded-[5px] outline-none transition-colors peer-hover:bg-background/60 peer-hover:text-foreground peer-checked:bg-background peer-checked:text-foreground peer-checked:shadow-xs peer-focus-visible:ring-[3px] peer-focus-visible:ring-ring/50 peer-disabled:cursor-not-allowed peer-disabled:opacity-50 [&_svg]:pointer-events-none [&_svg]:size-4 [&_svg]:shrink-0" data-slot="theme-toggle-label" title="{% if "light" == "system" %}System{% elif "light" == "light" %}Light{% elif "light" == "dark" %}Dark{% endif %}">
      {% if "light" == "system" %}<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>{% elif "light" == "light" %}<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>{% elif "light" == "dark" %}<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>{% endif %}
      <span class="sr-only">{% if "light" == "system" %}System{% elif "light" == "light" %}Light{% elif "light" == "dark" %}Dark{% endif %}</span>
    </label>
  </span>
  <span class="relative inline-flex">
    <input type="radio"
           id="{{ id }}-dark"
           name="{{ name }}"
           value="dark"{% if "dark" == value %} checked{% endif %}{% if disabled %} disabled{% endif %}
           class="peer sr-only"
           data-slot="theme-toggle-item">
    <label for="{{ id }}-dark" class="relative inline-flex size-7 cursor-pointer items-center justify-center rounded-[5px] outline-none transition-colors peer-hover:bg-background/60 peer-hover:text-foreground peer-checked:bg-background peer-checked:text-foreground peer-checked:shadow-xs peer-focus-visible:ring-[3px] peer-focus-visible:ring-ring/50 peer-disabled:cursor-not-allowed peer-disabled:opacity-50 [&_svg]:pointer-events-none [&_svg]:size-4 [&_svg]:shrink-0" data-slot="theme-toggle-label" title="{% if "dark" == "system" %}System{% elif "dark" == "light" %}Light{% elif "dark" == "dark" %}Dark{% endif %}">
      {% if "dark" == "system" %}<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>{% elif "dark" == "light" %}<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>{% elif "dark" == "dark" %}<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>{% endif %}
      <span class="sr-only">{% if "dark" == "system" %}System{% elif "dark" == "light" %}Light{% elif "dark" == "dark" %}Dark{% endif %}</span>
    </label>
  </span>
</div>
{% endlocalize %}
