{# slider — Django Cotton. See registry/ui/slider.tsx for platform references. #}
<c-vars
  :id="None"
  :name="None"
  :value="None"
  :min="0"
  :max="100"
  :step="None"
  :disabled="False"
  :required="False"
  :form="None"
  :list="None"
  :aria-label="None"
  :aria-labelledby="None"
  :aria-describedby="None"
  :aria-valuetext="None"
  class=""
/>
{% load l10n %}{% localize off %}
<span data-slot="slider"{% if disabled %} data-disabled="true"{% endif %}
      class="relative flex w-full touch-none items-center select-none {% if disabled %}opacity-50{% endif %} {{ class }}">
  <input type="range"{% if id %} id="{{ id|default_if_none:"" }}"{% endif %}{% if name %} name="{{ name|default_if_none:"" }}"{% endif %}{% if value is not None %} value="{{ value|default_if_none:"" }}"{% endif %}
    min="{{ min }}" max="{{ max }}"
    {% if step %} step="{{ step|default_if_none:"" }}"{% endif %}{% if disabled %} disabled{% endif %}{% if required %} required{% endif %}{% if form %} form="{{ form|default_if_none:"" }}"{% endif %}{% if list %} list="{{ list|default_if_none:"" }}"{% endif %}{% if aria_label %} aria-label="{{ aria_label|default_if_none:"" }}"{% endif %}{% if aria_labelledby %} aria-labelledby="{{ aria_labelledby|default_if_none:"" }}"{% endif %}{% if aria_describedby %} aria-describedby="{{ aria_describedby|default_if_none:"" }}"{% endif %}{% if aria_valuetext %} aria-valuetext="{{ aria_valuetext|default_if_none:"" }}"{% endif %}
    class="h-2 w-full cursor-pointer appearance-none bg-transparent outline-none
           [&::-webkit-slider-runnable-track]:h-1.5 [&::-webkit-slider-runnable-track]:rounded-full [&::-webkit-slider-runnable-track]:bg-muted
           [&::-moz-range-track]:h-1.5 [&::-moz-range-track]:rounded-full [&::-moz-range-track]:bg-muted
           [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:-mt-1 [&::-webkit-slider-thumb]:size-4 [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:border-2 [&::-webkit-slider-thumb]:border-primary [&::-webkit-slider-thumb]:bg-background [&::-webkit-slider-thumb]:shadow-sm
           [&::-moz-range-thumb]:size-4 [&::-moz-range-thumb]:rounded-full [&::-moz-range-thumb]:border-2 [&::-moz-range-thumb]:border-primary [&::-moz-range-thumb]:bg-background [&::-moz-range-thumb]:shadow-sm
           focus-visible:[&::-webkit-slider-thumb]:ring-[3px] focus-visible:[&::-webkit-slider-thumb]:ring-ring/50 focus-visible:[&::-moz-range-thumb]:shadow-[0_0_0_3px_color-mix(in_oklch,var(--color-ring)_50%,transparent)]
           disabled:cursor-not-allowed" {{ attrs }}>
</span>
{% endlocalize %}
