{# color-picker — Django Cotton. See registry/ui/color-picker.tsx for platform references. #}
<c-vars
  :id="None"
  :name="None"
  value="#000000"
  :required="False"
  :disabled="False"
  :autofocus="False"
  :form="None"
  :list="None"
  :autocomplete="None"
  :alpha="False"
  :colorspace="None"
  :show-value="True"
  :aria-label="None"
  :aria-labelledby="None"
  :aria-describedby="None"
  :aria-invalid="None"
  :aria-required="None"
  class=""
/>
{% load l10n %}{% localize off %}
{% if show_value %}<span data-slot="color-picker"{% if disabled %} data-disabled="true"{% endif %}
      class="inline-flex items-center gap-2{% if disabled %} opacity-50{% endif %} {{ class }}" {{ attrs }}>
  <input type="color"{% if id %} id="{{ id|default_if_none:"" }}"{% endif %}{% if name %} name="{{ name|default_if_none:"" }}"{% endif %}

       data-slot="color-picker-swatch"
       class="size-9 shrink-0 cursor-pointer rounded-md border border-input bg-transparent p-1 shadow-xs outline-none transition-[color,box-shadow] dark:bg-input/30 focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 aria-invalid:border-destructive aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 disabled:pointer-events-none disabled:cursor-not-allowed disabled:opacity-50 [&.htmx-request]:opacity-70 [&::-webkit-color-swatch-wrapper]:p-0 [&::-webkit-color-swatch]:rounded-sm [&::-webkit-color-swatch]:border-0 [&::-moz-color-swatch]:rounded-sm [&::-moz-color-swatch]:border-0">
  <output data-slot="color-picker-value" aria-hidden="true" class="font-mono text-sm tabular-nums text-muted-foreground uppercase select-none">{{ value }}</output>
</span>{% else %}<input type="color"{% if id %} id="{{ id|default_if_none:"" }}"{% endif %}{% if name %} name="{{ name|default_if_none:"" }}"{% endif %}
       value="{{ value }}"{% if required %} required{% endif %}{% if disabled %} disabled{% endif %}{% if autofocus %} autofocus{% endif %}{% if form %} form="{{ form|default_if_none:"" }}"{% endif %}{% if list %} list="{{ list|default_if_none:"" }}"{% endif %}{% if autocomplete %} autocomplete="{{ autocomplete|default_if_none:"" }}"{% endif %}{% if alpha %} alpha{% endif %}{% if colorspace %} colorspace="{{ colorspace|default_if_none:"" }}"{% endif %}{% if aria_label %} aria-label="{{ aria_label|default_if_none:"" }}"{% endif %}{% if aria_labelledby %} aria-labelledby="{{ aria_labelledby|default_if_none:"" }}"{% endif %}{% if aria_describedby %} aria-describedby="{{ aria_describedby|default_if_none:"" }}"{% endif %}{% if aria_invalid is not None %} aria-invalid="{{ aria_invalid|lower }}"{% endif %}{% if aria_required is not None %} aria-required="{{ aria_required|lower }}"{% endif %}
       data-slot="color-picker"
       class="size-9 shrink-0 cursor-pointer rounded-md border border-input bg-transparent p-1 shadow-xs outline-none transition-[color,box-shadow] dark:bg-input/30 focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 aria-invalid:border-destructive aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 disabled:pointer-events-none disabled:cursor-not-allowed disabled:opacity-50 [&.htmx-request]:opacity-70 [&::-webkit-color-swatch-wrapper]:p-0 [&::-webkit-color-swatch]:rounded-sm [&::-webkit-color-swatch]:border-0 [&::-moz-color-swatch]:rounded-sm [&::-moz-color-swatch]:border-0 {{ class }}" {{ attrs }}>{% endif %}
