{# selectable-table — Django Cotton. See registry/ui/selectable-table.tsx for platform references. #}
<c-vars
  aria-label="Select all rows"
  :id="None"
  class=""
/>
{% load l10n %}{% localize off %}
<span {{ attrs }} class="relative inline-flex size-4 shrink-0 align-middle">
  <input type="checkbox" {% if id %}id="{{ id|default_if_none:"" }}"{% endif %} data-slot="selectable-table-select-all" aria-label="{{ aria_label }}" class="peer size-4 shrink-0 appearance-none rounded-[4px] border border-input bg-background shadow-xs transition-shadow outline-none focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 disabled:cursor-not-allowed disabled:opacity-50 checked:border-primary checked:bg-primary indeterminate:border-primary indeterminate:bg-primary dark:bg-input/30 {{ class }}">
  <svg class="pointer-events-none absolute inset-0 m-auto hidden size-3 text-primary-foreground peer-checked:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12" /></svg>
  <svg class="pointer-events-none absolute inset-0 m-auto hidden size-3 text-primary-foreground peer-indeterminate:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12" /></svg>
</span>
{% endlocalize %}
