{# selectable-table — Django Cotton. See registry/ui/selectable-table.tsx for platform references. #}
<c-vars
  :aria-label="None"
  :aria-labelledby="None"
  class=""
/>
{% load l10n %}{% localize off %}
<form data-slot="selectable-table"{% if aria_label %}aria-label="{{ aria_label|default_if_none:"" }}"{% endif %}
  {% if aria_labelledby %}aria-labelledby="{{ aria_labelledby|default_if_none:"" }}"{% endif %}
  class="group/selectable-table w-full space-y-3 {{ class }}" {{ attrs }}>{{ slot }}</form>
{% endlocalize %}
