{# exclusive-accordion — Django Cotton. See registry/ui/exclusive-accordion.tsx for platform references. #}
<c-vars
  :text="None"
  class=""
/>
{% load l10n %}{% localize off %}
<summary {{ attrs }} data-slot="exclusive-accordion-trigger"
  class="flex cursor-pointer items-start justify-between gap-4 rounded-md py-4 text-left text-sm font-medium transition-all outline-none select-none marker:hidden hover:underline focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 list-none [&::-webkit-details-marker]:hidden [details[open]>&_[data-slot=exclusive-accordion-chevron]]:rotate-180 {{ class }}">
  {% if slot %}{{ slot }}{% else %}{{ text|default_if_none:"" }}{% endif %}
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
       data-slot="exclusive-accordion-chevron"
       class="pointer-events-none size-4 shrink-0 translate-y-0.5 text-muted-foreground transition-transform duration-200" aria-hidden="true">
    <polyline points="6 9 12 15 18 9" />
  </svg>
</summary>
{% endlocalize %}
