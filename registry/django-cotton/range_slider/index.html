{# range-slider — Django Cotton. See registry/ui/range-slider.tsx for platform references. #}
<c-vars
  :id="None"
  min-name="min"
  max-name="max"
  :min-value="None"
  :max-value="None"
  :min="0"
  :max="100"
  :step="None"
  :list="None"
  :disabled="False"
  :form="None"
  min-label="Minimum"
  max-label="Maximum"
  :aria-labelledby="None"
  :aria-describedby="None"
  :min-valuetext="None"
  :max-valuetext="None"
  class=""
/>
{% load l10n %}{% localize off %}
{% load shadcn_htmx %}
{% scn_range min_value max_value min max as range_data %}
<span data-slot="range-slider"{% if disabled %} data-disabled="true"{% endif %}
      style="--range-min:{{ range_data.low_percent }}%;--range-max:{{ range_data.high_percent }}%"
      class="relative flex h-4 w-full touch-none items-center select-none {% if disabled %}opacity-50{% endif %} {{ class }}" {{ attrs }}>
  <span class="pointer-events-none absolute inset-x-0 top-1/2 h-1.5 -translate-y-1/2 rounded-full bg-muted" aria-hidden="true"></span>
  <span class="pointer-events-none absolute top-1/2 h-1.5 -translate-y-1/2 rounded-full bg-primary [left:var(--range-min,0%)] [right:calc(100%-var(--range-max,100%))]" aria-hidden="true"></span>
  <input type="range" data-range="min"{% if id %} id="{{ id|default_if_none:"" }}-min"{% endif %}
    name="{{ min_name }}" value="{{ range_data.low }}"
    min="{{ min }}" max="{{ max }}"{% if step %} step="{{ step|default_if_none:"" }}"{% endif %}
    {% if list %} list="{{ list|default_if_none:"" }}"{% endif %}{% if disabled %} disabled{% endif %}{% if form %} form="{{ form|default_if_none:"" }}"{% endif %}{% if aria_labelledby %} aria-labelledby="{{ aria_labelledby|default_if_none:"" }}"{% else %} aria-label="{{ min_label }}"{% endif %}{% if aria_describedby %} aria-describedby="{{ aria_describedby|default_if_none:"" }}"{% endif %}{% if min_valuetext %} aria-valuetext="{{ min_valuetext|default_if_none:"" }}"{% endif %}
    class="pointer-events-none absolute inset-x-0 top-1/2 m-0 h-4 w-full -translate-y-1/2 cursor-pointer appearance-none bg-transparent outline-none
           [&::-webkit-slider-runnable-track]:h-1.5 [&::-webkit-slider-runnable-track]:bg-transparent
           [&::-moz-range-track]:h-1.5 [&::-moz-range-track]:bg-transparent
           [&::-webkit-slider-thumb]:pointer-events-auto [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:-mt-1 [&::-webkit-slider-thumb]:size-4 [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:border-2 [&::-webkit-slider-thumb]:border-primary [&::-webkit-slider-thumb]:bg-background [&::-webkit-slider-thumb]:shadow-sm
           [&::-moz-range-thumb]:pointer-events-auto [&::-moz-range-thumb]:size-4 [&::-moz-range-thumb]:rounded-full [&::-moz-range-thumb]:border-2 [&::-moz-range-thumb]:border-primary [&::-moz-range-thumb]:bg-background [&::-moz-range-thumb]:shadow-sm
           focus-visible:[&::-webkit-slider-thumb]:ring-[3px] focus-visible:[&::-webkit-slider-thumb]:ring-ring/50 focus-visible:[&::-moz-range-thumb]:shadow-[0_0_0_3px_color-mix(in_oklch,var(--color-ring)_50%,transparent)]
           disabled:cursor-not-allowed">
  <input type="range" data-range="max"{% if id %} id="{{ id|default_if_none:"" }}-max"{% endif %}
    name="{{ max_name }}" value="{{ range_data.high }}"
    min="{{ min }}" max="{{ max }}"{% if step %} step="{{ step|default_if_none:"" }}"{% endif %}
    {% if list %} list="{{ list|default_if_none:"" }}"{% endif %}{% if disabled %} disabled{% endif %}{% if form %} form="{{ form|default_if_none:"" }}"{% endif %}{% if aria_labelledby %} aria-labelledby="{{ aria_labelledby|default_if_none:"" }}"{% else %} aria-label="{{ max_label }}"{% endif %}{% if aria_describedby %} aria-describedby="{{ aria_describedby|default_if_none:"" }}"{% endif %}{% if max_valuetext %} aria-valuetext="{{ max_valuetext|default_if_none:"" }}"{% endif %}
    class="pointer-events-none absolute inset-x-0 top-1/2 m-0 h-4 w-full -translate-y-1/2 cursor-pointer appearance-none bg-transparent outline-none
           [&::-webkit-slider-runnable-track]:h-1.5 [&::-webkit-slider-runnable-track]:bg-transparent
           [&::-moz-range-track]:h-1.5 [&::-moz-range-track]:bg-transparent
           [&::-webkit-slider-thumb]:pointer-events-auto [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:-mt-1 [&::-webkit-slider-thumb]:size-4 [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:border-2 [&::-webkit-slider-thumb]:border-primary [&::-webkit-slider-thumb]:bg-background [&::-webkit-slider-thumb]:shadow-sm
           [&::-moz-range-thumb]:pointer-events-auto [&::-moz-range-thumb]:size-4 [&::-moz-range-thumb]:rounded-full [&::-moz-range-thumb]:border-2 [&::-moz-range-thumb]:border-primary [&::-moz-range-thumb]:bg-background [&::-moz-range-thumb]:shadow-sm
           focus-visible:[&::-webkit-slider-thumb]:ring-[3px] focus-visible:[&::-webkit-slider-thumb]:ring-ring/50 focus-visible:[&::-moz-range-thumb]:shadow-[0_0_0_3px_color-mix(in_oklch,var(--color-ring)_50%,transparent)]
           disabled:cursor-not-allowed">
</span>
{% endlocalize %}
