{# popover — Django Cotton. See registry/ui/popover.tsx for platform references. #}
<c-vars
  :id="None"
  mode="auto"
  side="bottom"
  class=""
  :role="None"
  :aria-labelledby="None"
  :aria-label="None"
/>
{% load l10n %}{% localize off %}
<div {{ attrs }} id="{{ id|default_if_none:"" }}"
     popover="{% if mode == "manual" %}manual{% elif mode == "hint" %}hint{% else %}auto{% endif %}"
     data-slot="popover" data-side="{{ side }}"
     {% if role %}role="{{ role|default_if_none:"" }}"{% endif %}
     {% if aria_labelledby %}aria-labelledby="{{ aria_labelledby|default_if_none:"" }}"{% endif %}
     {% if aria_label %}aria-label="{{ aria_label|default_if_none:"" }}"{% endif %}
     class="z-50 m-0 w-72 rounded-md border bg-popover p-4 text-popover-foreground shadow-md outline-none [&:not(:popover-open)]:hidden [&:popover-open]:animate-[scn-popover-in_120ms_ease-out] {% if side == "top" %}anchor-popover-top{% elif side == "bottom" %}anchor-popover-bottom{% elif side == "left" %}anchor-popover-left{% elif side == "right" %}anchor-popover-right{% endif %} {{ class }}">
{{ slot }}</div>
{% endlocalize %}
