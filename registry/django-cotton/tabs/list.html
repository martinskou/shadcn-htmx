{# tabs — Django Cotton. See registry/ui/tabs.tsx for platform references. #}
<c-vars
  :aria-label="None"
  :aria-labelledby="None"
  class=""
/>
{% load l10n %}{% localize off %}
<div {{ attrs }} role="tablist"{% if aria_label %} aria-label="{{ aria_label|default_if_none:"" }}"{% endif %}{% if aria_labelledby %} aria-labelledby="{{ aria_labelledby|default_if_none:"" }}"{% endif %}
     data-slot="tabs-list"
     class="inline-flex h-9 w-fit items-center justify-center rounded-lg bg-muted p-[3px] text-muted-foreground group-data-[orientation=vertical]/tabs:h-fit group-data-[orientation=vertical]/tabs:flex-col {{ class }}">{{ slot }}</div>
{% endlocalize %}
