{# tabs — Django Cotton. See registry/ui/tabs.tsx for platform references. #}
<c-vars
  :value="None"
  :label="None"
  :disabled="False"
  class=""
/>
{% load l10n %}{% localize off %}
<button type="button"
        role="tab"
        data-slot="tabs-trigger"
        data-tab-trigger="{{ value|default_if_none:"" }}"
        {% if disabled %} disabled{% endif %} {{ attrs }}
        class="relative inline-flex h-[calc(100%-1px)] flex-1 items-center justify-center gap-1.5 rounded-md border border-transparent px-3 py-1 text-sm font-medium whitespace-nowrap text-foreground/60 transition-all hover:text-foreground focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 focus-visible:outline-none disabled:pointer-events-none disabled:opacity-50 aria-selected:bg-background aria-selected:text-foreground aria-selected:shadow-sm dark:aria-selected:border-input dark:aria-selected:bg-input/30 dark:aria-selected:text-foreground group-data-[orientation=vertical]/tabs:w-full group-data-[orientation=vertical]/tabs:justify-start [&_svg]:pointer-events-none [&_svg]:shrink-0 [&_svg:not([class*='size-'])]:size-4 {{ class }}">{% if slot %}{{ slot }}{% else %}{{ label|default_if_none:"" }}{% endif %}</button>
{% endlocalize %}
