{# menubar — Django Cotton. See registry/ui/menubar.tsx for platform references. #}
<c-vars
  :label="None"
  :id="None"
  :disabled="False"
  trigger-class=" {{ class }}"
  content-class=""
  class=""
/>
{% load l10n %}{% localize off %}
<div {{ attrs }} data-slot="menubar-menu" class="contents">
  <button type="button" role="menuitem" tabindex="-1"
          popovertarget="{{ id|default_if_none:"" }}" popovertargetaction="toggle"
          aria-haspopup="menu" aria-expanded="false"
          data-slot="menubar-trigger" data-menu-for="{{ id|default_if_none:"" }}"{% if disabled %} data-disabled="true" disabled{% endif %}
          class="flex select-none items-center rounded-sm px-3 py-1 text-sm font-medium outline-none focus:bg-accent focus:text-accent-foreground aria-[expanded=true]:bg-accent aria-[expanded=true]:text-accent-foreground data-[disabled=true]:pointer-events-none data-[disabled=true]:opacity-50 {{ trigger_class }}">{{ label|default_if_none:"" }}</button>
  <div id="{{ id|default_if_none:"" }}" popover="auto" role="menu" aria-label="{{ label|default_if_none:"" }}"
       data-slot="menubar-content" data-side="bottom"
       class="z-50 m-0 min-w-[12rem] rounded-md border bg-popover p-1 text-popover-foreground shadow-md outline-none [&:not(:popover-open)]:hidden [&:popover-open]:animate-[scn-popover-in_120ms_ease-out] anchor-popover-bottom {{ content_class }}">
{{ slot }}</div></div>
{% endlocalize %}
