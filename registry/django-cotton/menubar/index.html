{# menubar — Django Cotton. See registry/ui/menubar.tsx for platform references. #}
<c-vars
  :aria-label="None"
  :aria-labelledby="None"
  class=""
/>
{% load l10n %}{% localize off %}
<div {{ attrs }} role="menubar" data-slot="menubar"{% if aria_label %} aria-label="{{ aria_label|default_if_none:"" }}"{% endif %}{% if aria_labelledby %} aria-labelledby="{{ aria_labelledby|default_if_none:"" }}"{% endif %}
     class="inline-flex h-9 items-center gap-0.5 rounded-md border bg-background p-1 shadow-xs {{ class }}">
{{ slot }}</div>
{% endlocalize %}
