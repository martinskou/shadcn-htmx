{# dialog — Django Cotton. See registry/ui/dialog.tsx for platform references. #}
<c-vars
  :label="None"
  :dialog-for="None"
  type="button"
  :id="None"
  class=""
  :native="False"
/>
{% load l10n %}{% localize off %}
<button {{ attrs }} {% if id %} id="{{ id|default_if_none:"" }}"{% endif %}
        type="{{ type }}"
        class="{{ class }}"{% if native %} command="show-modal" commandfor="{{ dialog_for|default_if_none:"" }}"{% else %} data-dialog-trigger="true" data-dialog-target="{{ dialog_for|default_if_none:"" }}"{% endif %}
        aria-haspopup="dialog">{% if slot %}{{ slot }}{% else %}{{ label|default_if_none:"" }}{% endif %}</button>
{% endlocalize %}
