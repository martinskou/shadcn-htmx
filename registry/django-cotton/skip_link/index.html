{# skip-link — Django Cotton. See registry/ui/skip-link.tsx for platform references. #}
<c-vars
  label="Skip to main content"
  href="#main"
  :id="None"
  class=""
/>
{% load l10n %}{% localize off %}
<a href="{{ href }}"{% if id %} id="{{ id|default_if_none:"" }}"{% endif %}
   data-slot="skip-link"
   class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:inline-flex focus:items-center focus:gap-2 focus:rounded-md focus:bg-primary focus:px-4 focus:py-2 focus:text-sm focus:font-medium focus:text-primary-foreground focus:shadow-md focus:no-underline focus:outline-none focus:ring-[3px] focus:ring-ring/50 {{ class }}" {{ attrs }}>{% if slot %}{{ slot }}{% else %}{{ label }}{% endif %}</a>
{% endlocalize %}
