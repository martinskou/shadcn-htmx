{# edit-in-place — Django Cotton. See registry/ui/edit-in-place.tsx for platform references. #}
<c-vars
  :edit-href="None"
  :fields="None"
  edit-label="Edit"
  :id="None"
  class=""
  :caller="None"
/>
{% load l10n %}{% localize off %}
<div {{ attrs }} data-slot="edit-in-place" data-mode="view"{% if id %} id="{{ id|default_if_none:"" }}"{% endif %}
     hx-target="this" hx-swap="outerHTML"
     class="flex w-full max-w-sm flex-col gap-4 rounded-xl border bg-card p-5 text-card-foreground shadow-sm {{ class }}">{% if fields %}
  <dl class="flex flex-col gap-3" data-slot="edit-in-place-fields">{% for f in fields %}
    <div>
      <dt class="text-xs font-medium tracking-wide text-muted-foreground uppercase">{{ f.label }}</dt>
      <dd class="mt-0.5 text-sm font-medium text-foreground">{{ f.value }}</dd>
    </div>{% endfor %}
  </dl>{% elif slot %}{{ slot }}{% endif %}
  <div class="flex">
    <button type="button" data-slot="edit-in-place-edit" hx-get="{{ edit_href|default_if_none:"" }}" hx-target="closest [data-slot='edit-in-place']" hx-swap="outerHTML" class="inline-flex shrink-0 items-center justify-center gap-2 rounded-md text-sm font-medium whitespace-nowrap transition-all outline-none focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 disabled:pointer-events-none disabled:opacity-50 aria-disabled:pointer-events-none aria-disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 [&_svg]:pointer-events-none [&_svg]:shrink-0 [&_svg:not([class*='size-'])]:size-4 [&.htmx-request]:pointer-events-none [&.htmx-request]:opacity-70 border bg-background shadow-xs hover:bg-accent hover:text-accent-foreground dark:border-input dark:bg-input/30 dark:hover:bg-input/50 h-8 gap-1.5 rounded-md px-3 has-[>svg]:px-2.5">{{ edit_label }}</button>
  </div>
</div>
{% endlocalize %}
