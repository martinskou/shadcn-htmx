{# breadcrumb — Django Cotton. See registry/ui/breadcrumb.tsx for platform references. #}
<c-vars
  :body="None"
  class=" {{ class }}"
/>
{% load l10n %}{% localize off %}
<li data-slot="breadcrumb-separator" aria-hidden="true" class="[&>svg]:size-3.5" {{ attrs }}>{% if body %}{% if slot %}{{ slot }}{% else %}{{ body|default_if_none:"" }}{% endif %}{% else %}<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6" /></svg>{% endif %}</li>
{% endlocalize %}
