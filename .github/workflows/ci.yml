name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Typecheck · build · CLI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test:cli

  cotton:
    name: Django-Cotton rendering (${{ matrix.django }}, Cotton ${{ matrix.cotton }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - django: "~=4.2.0"
            cotton: "==2.9.0"
          - django: "~=5.2.0"
            cotton: ">=2.9,<3.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "Django${{ matrix.django }}" "django-cotton${{ matrix.cotton }}"
      - run: python -m unittest discover -s tests/cotton -v

  e2e:
    name: Playwright e2e (a11y · keyboard · geometry · smoke · console)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run e2e
        run: |
          PORT=3010 bun run app/server.tsx > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3010/ >/dev/null && break
            sleep 1
          done
          bun run test:e2e
